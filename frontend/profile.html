<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        if (window.location.hostname === '127.0.0.1') {
            window.location.href = window.location.href.replace('127.0.0.1', 'localhost');
        }
    </script>
    <style>
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .profile-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .profile-section {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .profile-section:last-child {
            border-bottom: none;
        }

        .profile-section h3 {
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .info-item label {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.875rem;
        }

        .info-item p {
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            margin-top: 2rem;
            width: 100%;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <div class="profile-header">
            <h2>User Profile</h2>
            <p style="color: var(--text-muted);">View and manage your account details</p>
        </div>

        <div class="profile-card" id="profileContent" style="display: none;">
            <div class="profile-section">
                <h3>Personal Information</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Username</label>
                        <p id="username">Loading...</p>
                    </div>
                    <div class="info-item">
                        <label>Email Address</label>
                        <p id="email">Loading...</p>
                    </div>
                    <div class="info-item">
                        <label>Phone Number</label>
                        <p id="phone">Loading...</p>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <h3>Address Details</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Address</label>
                        <p id="address">Loading...</p>
                    </div>
                    <div class="info-item">
                        <label>Pincode</label>
                        <p id="pincode">Loading...</p>
                    </div>
                </div>
            </div>


            <div style="padding: 2rem;">
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="loading" style="text-align: center; margin-top: 4rem;">
            Loading profile...
        </div>
    </div>

    <script>
        async function fetchProfile() {
            try {
                // Relies on HttpOnly cookie via credentials: 'include'
                const response = await fetch('http://localhost:3000/users/profile', {
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });

                if (response.status === 401) {
                    // Unauthorized - token/cookie missing or invalid
                    window.location.href = 'login.html';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to fetch profile');
                }

                const user = await response.json();

                // Populate fields
                document.getElementById('username').textContent = user.username;
                document.getElementById('email').textContent = user.email;
                document.getElementById('phone').textContent = user.phone;
                document.getElementById('address').textContent = user.address || 'Not provided';
                document.getElementById('pincode').textContent = user.pincode || 'Not provided';

                // Show content
                document.getElementById('profileContent').style.display = 'block';
                document.getElementById('loading').style.display = 'none';


            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').textContent = 'Error loading profile. Please try again.';
            }
        }

        async function logout() {
            try {
                await fetch('http://localhost:3000/users/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                window.location.href = 'index.html'; // Redirect to home instead of login after logout is friendlier
            } catch (error) {
                console.error("Logout failed", error);
                window.location.href = 'login.html';
            }
        }

        window.onload = fetchProfile;

    </script>
</body>

</html>
